<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chisto - Smart Food Delivery</title>
    <!-- Leaflet Map CSS & JS CDN (Global Load) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- PWA configuration links -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0c2340" />
  </head>
  <body>
    <div id="root">
      <!-- Premium Loading Splash Screen -->
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Outfit', sans-serif; background-color: #f7fafc; color: #0c2340;">
        <img src="/food.png" alt="Delightful Food" style="width: 120px; height: 120px; border-radius: 50%; box-shadow: 0 8px 24px rgba(12,35,64,0.15); margin-bottom: 20px; animation: splashPulse 2s infinite ease-in-out;" />
        <h2 style="margin: 0; font-weight: 700; font-size: 26px; letter-spacing: 0.5px;">CHISTO</h2>
        <p style="margin: 6px 0 0 0; font-size: 14px; color: #718096; font-weight: 500;">Serving Happiness in Real-time...</p>
        <style>
          @keyframes splashPulse {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.06) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
